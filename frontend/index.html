<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cult/Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h1>Cult/Vault</h1>
        <div class="nav-links">
            <span id="userStatus" class="hidden">Συνδεδεμένος</span>
            <button id="logoutBtn" class="hidden">Logout</button>
        </div>
    </nav>

    <div class="container">
        <section id="loginSection" class="card">
            <h2>Login</h2>
            <p>Ξεκλείδωσε το Vault σου</p>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Είσοδος</button>
            </form>
            <p id="loginError" class="error hidden">Λάθος στοιχεία. Δοκίμασε ξανά.</p>
        </section>

        <section id="exploreSection" class="hidden">
            <div class="search-box card">
                <h2>Αναζήτηση</h2>
                <div class="search-controls">
                    <select id="mediaType">
                        <option value="movies">Ταινίες</option>
                        <option value="music">Μουσική</option>
                        <option value="books">Βιβλία</option>
                    </select>
                    <input type="text" id="searchQuery" placeholder="Τι ψάχνεις;">
                    <button id="searchBtn">Αναζήτηση</button>
                </div>
            </div>

            <div id="resultsGrid" class="results-grid"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
