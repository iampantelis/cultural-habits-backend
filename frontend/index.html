<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>Cult/Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <h1>Cult/Vault</h1>
        <div id="navSearchControls" class="search-controls hidden">
            <select id="mediaType">
                <option value="movies">Ταινίες</option>
                <option value="music">Μουσική</option>
                <option value="books">Βιβλία</option>
            </select>
            <input type="text" id="searchQuery" placeholder="Τι ψάχνεις;">
            <button id="searchBtn">Αναζήτηση</button>
        </div>
        <div class="nav-links">
            <button id="userStatusBtn" class="nav-btn hidden">👤 Το Προφίλ μου</button>
            <button id="logoutBtn" class="logout-btn hidden">Logout</button>
        </div>
    </nav>

    <div class="container">
        <section id="loginSection" class="card">
            <h2>Login</h2>
            <form id="loginForm">
               <input type="text" name="username" id="username" placeholder="Username" required>
                <input type="password" name="password" id="password" placeholder="Password" required>
                <button type="submit">Είσοδος</button>
            </form>
            <p id="loginError" class="error hidden">Λάθος στοιχεία.</p>
        </section>

        <section id="exploreSection" class="hidden">
            <div id="resultsGrid" class="results-grid"></div>
        </section>

        <section id="detailsSection" class="card hidden">
            <button id="backBtn" class="btn-secondary">⬅️ Πίσω</button>
            <div class="details-layout">
                <div class="details-poster" id="detailPosterContainer"></div>
                <div class="details-info">
                    <h2 id="detailTitle"></h2>
                    <p id="detailType"></p>
                    <p id="detailDescription"></p>
                    <div class="rating-box">
                        <label>Βαθμολογία: <span id="ratingDisplay">5.0</span> ⭐</label>
                        <input type="range" id="ratingSlider" min="0.5" max="5.0" step="0.5" value="5.0">
                        <textarea id="reviewInput" placeholder="Κριτική..." rows="4"></textarea>
                        <button id="submitVoteBtn">Αποθήκευση στο Vault</button>
                    </div>
                </div>
            </div>
        </section>

        <div id="profileOverlay" class="profile-overlay hidden">
            <div class="profile-sidebar">
                <div class="profile-header-top"><h2>Το Vault σου 🏛️</h2><button id="closeProfileBtn" class="close-btn">❌</button></div>
                <div class="sidebar-card"><h3>Αξιολογήσεις</h3><div id="myVaultGrid" class="sidebar-grid"></div></div>
                <div class="sidebar-card"><h3>Προτάσεις AI</h3><div id="recommendationsGrid" class="sidebar-grid"></div></div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
